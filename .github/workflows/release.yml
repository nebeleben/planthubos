name: Release firmware

# Tag-triggered firmware release on the PUBLIC mirror. The tag arrives here
# via the private repo's mirror workflow (which pushes exactly the triggering
# v*.*.* tag). Builds the web UI once, then the firmware for both supported
# chips inside the official ESP-IDF container, and publishes a GitHub
# Release with the binaries.
#
# Runs on GitHub-hosted runners: Actions is free for public repos, and a
# self-hosted runner must never be attached to a public repo (fork PRs would
# run arbitrary code on it).
#
# Auth: the standard GITHUB_TOKEN — release write on this repo only.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:

  webui:
    name: Build web UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: npm install + build
        run: |
          cd webui
          npm ci || npm install
          npm run build
      - name: Upload dist-gz
        uses: actions/upload-artifact@v4
        with:
          name: webui-dist-gz
          path: webui/dist-gz/
          if-no-files-found: error

  build:
    name: Build ${{ matrix.chip }} (${{ matrix.region }})
    needs: webui
    runs-on: ubuntu-latest
    container:
      # Per-chip IDF version (from the matrix include): esp32/esp32c3 stay
      # on v5.3.2 -- the version every shipped device was built and
      # hardware-validated with -- while esp32c5 needs v5.5+, where the C5
      # is a fully supported target (it is preview-only in 5.3/5.4).
      image: espressif/idf:${{ matrix.idf }}
    strategy:
      fail-fast: false
      matrix:
        chip: [esp32, esp32c3, esp32c5]
        include:
          - chip: esp32
            idf: v5.3.2
          - chip: esp32c3
            idf: v5.3.2
          - chip: esp32c5
            idf: v5.5.5
        # Per-region release builds (M9): each region overlay sets its own
        # CONFIG_PLANTHUB_WIFI_COUNTRY (sdkconfig.region.<region>) -- see
        # PlanV1 8e for why this can't just be one world-safe build. Region
        # is independently changeable later from the hub's Config page; this
        # matrix leg only decides the BUILD-TIME default a fresh flash boots
        # with.
        region: [eu, us, jp]
    steps:
      - name: Checkout firmware at tag
        uses: actions/checkout@v4

      - name: Mark workspace safe (container UID mismatch)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Download web UI bundle
        uses: actions/download-artifact@v4
        with:
          name: webui-dist-gz
          path: webui/dist-gz/

      - name: Build
        run: |
          . "$IDF_PATH/export.sh"
          # sdkconfig is not tracked (generated from sdkconfig.defaults);
          # per-chip-per-region build dirs keep all four matrix legs
          # independent. SDKCONFIG_DEFAULTS takes a semicolon-separated list
          # -- sdkconfig.defaults first, the region overlay second so it
          # wins on the one key they share (CONFIG_PLANTHUB_WIFI_COUNTRY);
          # IDF still auto-appends each listed file's own
          # "<file>.<target>" variant (e.g. sdkconfig.defaults.esp32) on top
          # of that, unchanged from the pre-region build.
          idf.py -B "build_${{ matrix.chip }}_${{ matrix.region }}" \
                 -D SDKCONFIG="build_${{ matrix.chip }}_${{ matrix.region }}/sdkconfig" \
                 -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.region.${{ matrix.region }}" \
                 -D IDF_TARGET=${{ matrix.chip }} build

      - name: Collect artifacts
        run: |
          B="build_${{ matrix.chip }}_${{ matrix.region }}"
          OUT="out"; mkdir -p "$OUT"
          cp "$B/planthub.bin" "$OUT/planthub-${{ matrix.chip }}-${{ matrix.region }}.bin"
          # bootloader/partition-table/ota_data are region-independent (the
          # region overlay only touches CONFIG_PLANTHUB_WIFI_COUNTRY, which
          # affects app.bin's embedded Kconfig value, not these three) --
          # their filenames deliberately carry no region suffix. Emitting
          # them from every region leg would make two same-chip legs upload
          # identically-named files (e.g. bootloader-esp32.bin from both the
          # eu and us legs); the release job's merge-multiple download
          # writes all artifacts into one flat directory, so that would
          # collide. Emit them from exactly one region per chip (eu) instead.
          if [ "${{ matrix.region }}" = "eu" ]; then
            cp "$B/bootloader/bootloader.bin"           "$OUT/bootloader-${{ matrix.chip }}.bin"
            cp "$B/partition_table/partition-table.bin" "$OUT/partition-table-${{ matrix.chip }}.bin"
            cp "$B/ota_data_initial.bin"                "$OUT/ota_data_initial-${{ matrix.chip }}.bin"
          fi
          ls -la "$OUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.chip }}-${{ matrix.region }}
          path: out/
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all firmware artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          merge-multiple: true
          path: assets/
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          ## Which file do I need?

          | You are in | App image |
          |---|---|
          | Europe / UK / most of the world (channels 1-13) | `planthub-<chip>-eu.bin` |
          | United States / Canada (channels 1-11) | `planthub-<chip>-us.bin` |
          | Japan (channels 1-14) | `planthub-<chip>-jp.bin` |

          `<chip>` is `esp32c3`, `esp32c5` or `esp32`, matching your board. The region can
          also be changed later on the hub's Config page. Using a build for a
          region you are not in is a regulatory violation.

          The `bootloader-*`, `partition-table-*` and `ota_data_initial-*`
          files are the same for every region and only needed for a first
          install over USB.

          ## First install (USB)

          ESP32-C3:
          ```
          esptool --chip esp32c3 write_flash \
            0x0 bootloader-esp32c3.bin \
            0x8000 partition-table-esp32c3.bin \
            0xf000 ota_data_initial-esp32c3.bin \
            0x20000 planthub-esp32c3-eu.bin
          ```

          ESP32-C5 (note the different bootloader offset):
          ```
          esptool --chip esp32c5 write_flash \
            0x2000 bootloader-esp32c5.bin \
            0x8000 partition-table-esp32c5.bin \
            0xf000 ota_data_initial-esp32c5.bin \
            0x20000 planthub-esp32c5-eu.bin
          ```

          Classic ESP32 (again a different bootloader offset):
          ```
          esptool --chip esp32 write_flash \
            0x1000 bootloader-esp32.bin \
            0x8000 partition-table-esp32.bin \
            0xf000 ota_data_initial-esp32.bin \
            0x20000 planthub-esp32-eu.bin
          ```

          Then join the `PlantHub-XXXX` WiFi the device broadcasts and follow
          the setup page.

          ## Updating an existing hub

          No cables needed: open the hub's web page, Config tab, "Choose
          firmware..." and upload just the `planthub-<chip>-<region>.bin`.
          Paired nodes are then updated over the air from the Nodes tab.
          NOTES
          gh release create "${{ github.ref_name }}" assets/* \
            --repo "${{ github.repository }}" \
            --title "PlantHubOS ${{ github.ref_name }}" \
            --notes-file notes.md

    <script>
      // Applied synchronously, before first paint, so a stored preference
      // (set by the in-app toggle -- see main.jsx) doesn't flash the system
      // default theme for a frame on load. Purely presentational: reads the
      // same localStorage key the toggle writes, mirrors none of the app's
      // fetch/data logic.
      (function () {
        try {
          var t = localStorage.getItem('planthub-theme')
          if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
        } catch (e) {}
      })()
    </script>
